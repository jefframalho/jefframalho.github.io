<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maycell</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23F2B705'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='14' text-anchor='middle' fill='%231A1E26'%3EMC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: barra lateral fixa (desktop) / barra inferior (celular); conteúdo em coluna única de trabalho. Etiqueta amarela de oficina marca o número da OS. */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --surface-2:#ECEEF2; --ink:#1A1E26; --muted:#5A6271; --line:#D8DCE3;
  --tag:#F2B705; --tag-ink:#1A1E26; --accent:#1F55D6; --accent-ink:#FFFFFF;
  --ok:#1C8048; --ok-bg:#E2F3E8; --warn:#9A6408; --warn-bg:#FBF0D9; --bad:#B8322A; --bad-bg:#FBE4E2;
  --info:#2A62C9; --info-bg:#E3ECFB; --mute:#5A6271; --mute-bg:#E9EBEF; --acc-bg:#E6EBFA;
  --shadow:0 1px 2px rgba(20,24,32,.06),0 4px 14px rgba(20,24,32,.05);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111419; --surface:#191D25; --surface-2:#222833; --ink:#E7EAF0; --muted:#9AA3B3; --line:#2D3442;
  --tag:#F2B705; --tag-ink:#1A1E26; --accent:#7AA2FF; --accent-ink:#0F1420;
  --ok:#55C487; --ok-bg:#16301F; --warn:#E3AE52; --warn-bg:#33270F; --bad:#F2716A; --bad-bg:#3A1A18;
  --info:#82A9FF; --info-bg:#1A2742; --mute:#9AA3B3; --mute-bg:#262C37; --acc-bg:#1E2846;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111419; --surface:#191D25; --surface-2:#222833; --ink:#E7EAF0; --muted:#9AA3B3; --line:#2D3442;
  --tag:#F2B705; --tag-ink:#1A1E26; --accent:#7AA2FF; --accent-ink:#0F1420;
  --ok:#55C487; --ok-bg:#16301F; --warn:#E3AE52; --warn-bg:#33270F; --bad:#F2716A; --bad-bg:#3A1A18;
  --info:#82A9FF; --info-bg:#1A2742; --mute:#9AA3B3; --mute-bg:#262C37; --acc-bg:#1E2846;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:2rem;line-height:1.05}
h2{font-size:1.35rem}
h3{font-size:1.1rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);
  padding:20px 14px;padding-left:max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:10px}
.brand .mk{width:34px;height:34px;border-radius:7px;background:var(--tag);color:var(--tag-ink);display:grid;place-items:center;
  font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.brand b{font-family:var(--f-display);font-size:1.45rem;font-weight:700}
.brand small{display:block;color:var(--muted);font-size:.78rem;line-height:1.2;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;text-decoration:none;color:var(--muted);font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--surface-2);color:var(--ink)}
.nav svg{width:18px;height:18px;flex:none}
.side .new{margin-top:auto}

main{min-width:0;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head p{margin:4px 0 0;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);
  padding:9px 14px;border-radius:8px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.wa{background:#1F9D55;border-color:#1F9D55;color:#fff}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:6px 10px;font-size:.88rem}
.btn svg{width:17px;height:17px}

.banner{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.92rem}
.banner a{color:inherit;font-weight:600}

.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:4px}
.stat:hover{border-color:var(--muted)}
.stat span{color:var(--muted);font-size:.82rem;font-weight:500}
.stat b{font-family:var(--f-display);font-size:2.1rem;line-height:1;font-variant-numeric:tabular-nums}
.stat.warn b{color:var(--warn)} .stat.ok b{color:var(--ok)} .stat.bad b{color:var(--bad)}
.stat.money b{font-size:1.65rem}

.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel>header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);gap:10px}
.panel>header a{font-size:.88rem;font-weight:600;text-decoration:none}
.empty{padding:26px 16px;color:var(--muted);text-align:center}

.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.list .row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row .who{min-width:0}
.row .who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .who small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .end{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.row .val{font-family:var(--f-mono);font-size:.88rem;font-variant-numeric:tabular-nums}
.why{font-size:.8rem;color:var(--bad);font-weight:500}

.tag{position:relative;display:inline-flex;align-items:center;font-family:var(--f-display);font-weight:700;font-size:1.05rem;letter-spacing:.03em;
  background:var(--tag);color:var(--tag-ink);padding:3px 9px 3px 19px;border-radius:3px 6px 6px 3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag::before{content:"";position:absolute;left:6px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.tag.big{font-size:1.6rem;padding:5px 14px 5px 28px}
.tag.big::before{left:9px;width:9px;height:9px;margin-top:-4.5px}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-info{color:var(--info);background:var(--info-bg)} .c-warn{color:var(--warn);background:var(--warn-bg)}
.c-ok{color:var(--ok);background:var(--ok-bg)} .c-bad{color:var(--bad);background:var(--bad-bg)}
.c-mute{color:var(--mute);background:var(--mute-bg)} .c-acc{color:var(--accent);background:var(--acc-bg)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 240px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 12px}
.search input{border:0;background:none;padding:10px 0;width:100%;min-width:0;outline:none}
.search svg{width:17px;height:17px;color:var(--muted);flex:none}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:500;cursor:pointer;color:var(--muted)}
.fbtn b{font-variant-numeric:tabular-nums;margin-left:4px;color:var(--ink)}
.fbtn.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.fbtn.on b{color:var(--bg)}

/* editor */
.ed{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px}
.card h2{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label{font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.f .hint{font-size:.78rem;color:var(--muted)}
.f input,.f select,.f textarea{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:9px 11px;width:100%;min-width:0}
.f textarea{resize:vertical;min-height:70px}
.f input.mono{font-family:var(--f-mono)}
.f.span2{grid-column:span 2}
.f.span3{grid-column:span 3}
.err{border-color:var(--bad)!important}

.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.step{min-width:0;overflow-wrap:anywhere;text-align:center;font-size:.72rem;font-weight:600;color:var(--muted);padding:8px 4px 0;border-top:3px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0}
.step.done{border-top-color:var(--ok);color:var(--ink)}
.step.cur{border-top-color:var(--accent);color:var(--accent)}

.itens{width:100%;min-width:560px;border-collapse:collapse;font-size:.92rem}
.itens th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:0 6px 6px}
.itens td{padding:4px 6px;vertical-align:middle}
.itens input,.itens select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 8px;width:100%;min-width:0}
.itens .n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.itens .x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1.2rem;padding:4px 8px}
.tblwrap{overflow-x:auto;margin:0 -6px}
.totais{display:flex;flex-direction:column;gap:6px;align-self:flex-end;min-width:240px;max-width:100%}
.totais div{display:flex;justify-content:space-between;gap:16px;font-variant-numeric:tabular-nums}
.totais .tt{font-family:var(--f-display);font-size:1.6rem;font-weight:700;border-top:1px solid var(--line);padding-top:6px}
.totais input{width:110px;text-align:right;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-family:var(--f-mono)}

.fotos{display:flex;gap:8px;flex-wrap:wrap}
.foto{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.foto img{width:100%;height:100%;object-fit:cover}
.foto button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;line-height:1}
.addfoto{width:84px;height:84px;border:1.5px dashed var(--line);border-radius:8px;display:grid;place-items:center;color:var(--muted);cursor:pointer;font-size:.78rem;text-align:center}
.addfoto input{display:none}

.hist{display:flex;flex-direction:column;gap:8px;font-size:.88rem;margin:0;padding:0;list-style:none}
.hist li{display:flex;justify-content:space-between;gap:10px}
.hist time{color:var(--muted);font-family:var(--f-mono);font-size:.8rem}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.sticky-save{position:sticky;bottom:0;background:var(--bg);padding-block:12px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line);z-index:2}

/* clientes */
.cl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.list .cl:first-child{border-top:0}
.cl b{display:block}
.cl small{color:var(--muted)}

/* comprovante */
.overlay{position:fixed;inset:0;background:rgba(10,12,16,.55);z-index:20;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;
  padding:max(20px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet{background:#fff;color:#111;width:100%;max-width:640px;border-radius:6px;padding:28px;font-size:13px;line-height:1.45;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.sheet h3{font-size:1.5rem}
.sheet .top{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid #111;padding-bottom:10px;flex-wrap:wrap}
.sheet .osn{font-family:var(--f-display);font-size:1.7rem;font-weight:700;text-align:right}
.sheet section{padding:10px 0;border-bottom:1px solid #ccc}
.sheet .kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px}
.sheet .kv span{color:#555}
.sheet table{width:100%;border-collapse:collapse}
.sheet td,.sheet th{padding:4px 0;text-align:left}
.sheet .r{text-align:right;font-family:var(--f-mono)}
.sheet .sign{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:36px}
.sheet .sign div{border-top:1px solid #111;padding-top:4px;text-align:center;color:#444}
.sheet-actions{display:flex;gap:8px;justify-content:flex-end;margin-bottom:10px;flex-wrap:wrap;width:100%;max-width:640px}
.ov-inner{display:flex;flex-direction:column;align-items:center;width:100%}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;z-index:30;max-width:calc(100% - 32px)}
@media (min-width:861px){.toast{bottom:24px}}

.bottom{display:none}
@media (max-width:980px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.ed{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));padding-top:18px}
  .bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:.7rem;font-weight:600;padding:6px 0;border-radius:8px}
  .bottom a.on{color:var(--ink)}
  .bottom a.plus span:first-child{background:var(--accent);color:var(--accent-ink);border-radius:10px;width:40px;height:30px;display:grid;place-items:center}
  .bottom svg{width:20px;height:20px}
  .cols{grid-template-columns:minmax(0,1fr)}
  .sticky-save{bottom:calc(64px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:560px){
  h1{font-size:1.7rem}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat.money{grid-column:span 2}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .f.span2,.f.span3{grid-column:auto}
  .row{grid-template-columns:auto minmax(0,1fr);row-gap:6px}
  .row .end{grid-column:2;flex-direction:row;align-items:center;justify-content:space-between}
  .sheet{padding:18px}
  .sheet .kv{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

@media print{
  body *{visibility:hidden!important}
  #sheet,#sheet *{visibility:visible!important}
  #sheet{position:absolute;left:0;top:0;width:100%;max-width:none;box-shadow:none;padding:0}
  .overlay{position:static;background:none;padding:0}
}

html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="mk">MC</div><div><b>Maycell</b><small id="side-loja"></small></div></div>
    <nav class="nav" id="nav"></nav>
    <a class="btn pri new" href="#nova"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Nova OS</a>
  </aside>
  <main><div class="wrap" id="view"></div></main>
</div>
<nav class="bottom" id="bottom"></nav>
<div id="ov"></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ===== Ícones ===== */
const I={
 painel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
 ordens:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8Z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>',
 clientes:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></svg>',
 ajustes:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>',
 plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>',

/* ===== Status ===== */
const ST={
 recebido:{n:'Recebido',c:'info'}, analise:{n:'Em análise',c:'info'}, aguardando:{n:'Aguardando aprovação',c:'warn'},
 conserto:{n:'Em conserto',c:'acc'}, pronto:{n:'Pronto p/ retirada',c:'ok'}, entregue:{n:'Entregue',c:'mute'}, sem:{n:'Sem conserto',c:'bad'}
};
const FLUXO=['recebido','analise','aguardando','conserto','pronto','entregue'];
const aberta=s=>!['entregue','sem'].includes(s);

/* ===== Utilidades ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=n=>n?'OS '+String(n).padStart(4,'0'):'OS NOVA';
const dia=86400000;
const hojeStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fData=s=>{if(!s)return'—';const d=s.length===10?new Date(s+'T12:00:00'):new Date(s);return d.toLocaleDateString('pt-BR')};
const fHora=s=>{const d=new Date(s);return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})};
const dias=s=>Math.floor((Date.now()-new Date(s).getTime())/dia);
const haDias=s=>{const n=dias(s);return n<=0?'hoje':n===1?'há 1 dia':'há '+n+' dias'};
const digitos=s=>String(s||'').replace(/\D/g,'');
const chip=s=>`<span class="chip c-${ST[s].c}">${ST[s].n}</span>`;
const aparelho=o=>[o.tipo,o.marca,o.modelo].filter(Boolean).join(' ')||'Aparelho';
const total=o=>Math.max(0,(o.itens||[]).reduce((a,i)=>a+(+i.q||0)*(+i.v||0),0)-(+o.desconto||0));
const atrasada=o=>aberta(o.status)&&o.status!=='pronto'&&o.previsao&&o.previsao<hojeStr();
function motivo(o){
  if(atrasada(o))return'Previsão vencida em '+fData(o.previsao);
  const ult=(o.historico||[]).slice(-1)[0];const desde=ult?ult.em:o.criadoEm;
  if(o.status==='aguardando'&&dias(desde)>=2)return'Sem resposta do cliente '+haDias(desde);
  if(o.status==='pronto'&&dias(desde)>=7)return'Pronto e não retirado '+haDias(desde);
  return'';
}

/* ===== Comunicação com o banco (servidor Python) ===== */
async function api(metodo,url,corpo){
  let r;
  try{r=await fetch(url,{method:metodo,headers:corpo?{'Content-Type':'application/json'}:{},body:corpo?JSON.stringify(corpo):undefined})}
  catch(e){throw new Error('Sem conexão com o Maycell. Verifique se a janela do programa está aberta.')}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.erro||'Erro '+r.status);
  return j;
}

function shell(r){
  const base=r.startsWith('os-')||r==='nova'?'ordens':r;
  $('#nav').innerHTML=NAV.map(([k,n])=>`<a href="#${k}" class="${base===k?'on':''}">${I[k]}${n}</a>`).join('');
  const b=NAV.map(([k,n])=>`<a href="#${k}" class="${base===k&&r!=='nova'?'on':''}"><span>${I[k]}</span><span>${n}</span></a>`);
  b.splice(2,0,`<a href="#nova" class="plus ${r==='nova'?'on':''}"><span>${I.plus}</span><span>Nova OS</span></a>`);
  $('#bottom').innerHTML=b.join('');
  $('#side-loja').textContent=db.cfg.loja;
  document.title=db.cfg.loja&&db.cfg.loja!=='Maycell'?'Maycell · '+db.cfg.loja:'Maycell';
}
async function route(){
  const r=(location.hash||'#painel').slice(1);

    else if(r.startsWith('os-'))await vEditor(r.slice(3));

}

function vOrdens(){
  const F=[['abertas','Em aberto',o=>aberta(o.status)],['atrasadas','Atrasadas',atrasada],
    ...Object.keys(ST).map(k=>[k,ST[k].n,o=>o.status===k]),['todas','Todas',()=>true]];

   <div class="toolbar"><label class="search">${I.busca}<input id="q" placeholder="Buscar por nome, telefone, aparelho ou nº da OS" value="${esc(busca)}"></label></div>
   <div class="filters" id="fl">${F.map(([k,n,fn])=>`<button class="fbtn ${filtro===k?'on':''}" data-k="${k}">${n}<b>${db.os.filter(fn).length}</b></button>`).join('')}</div>
   <section class="panel"><div class="list" id="ls"></div></section>`;
  const desenha=()=>{
    const fn=(F.find(f=>f[0]===filtro)||F[0])[2];const q=busca.toLowerCase().trim();const qd=digitos(q);
    const r=db.os.filter(fn).filter(o=>{if(!q)return true;const c=cliente(o.clienteId);
      return (c.nome+' '+aparelho(o)+' '+o.defeito+' '+o.serie).toLowerCase().includes(q)||(qd&&(digitos(c.tel).includes(qd)||String(o.num)===String(+qd)))})
      .sort((a,b)=>b.num-a.num);
    $('#ls').innerHTML=r.length?r.map(o=>linha(o,motivo(o))).join(''):'<div class="empty">Nenhuma OS encontrada com esse filtro.</div>';
  };
  desenha();
  $('#q').addEventListener('input',e=>{busca=e.target.value;desenha()});
  $('#fl').addEventListener('click',e=>{const b=e.target.closest('.fbtn');if(!b)return;filtro=b.dataset.k;
    document.querySelectorAll('.fbtn').forEach(x=>x.classList.toggle('on',x===b));desenha()});
}

const parseNum=s=>{s=String(s).trim();if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return +s||0};
function desenhaSteps(){
  const i=FLUXO.indexOf(cur.status);
  $('#steps').innerHTML=FLUXO.map((k,j)=>`<button type="button" class="step ${cur.status==='sem'?'':j<i?'done':j===i?'cur':''}" data-s="${k}">${ST[k].n.replace(' p/ retirada','').replace(' aprovação','')}</button>`).join('');
  document.querySelectorAll('.step').forEach(b=>b.onclick=()=>{cur.status=b.dataset.s;$('#f-status').value=cur.status;desenhaSteps();if($('#f-msg'))gerarMsg()});
}
function desenhaItens(){
  $('#it').innerHTML=cur.itens.length?cur.itens.map((it,i)=>`<tr>
    <td><input data-i="${i}" data-k="d" id="it-d-${i}" value="${esc(it.d)}" placeholder="Ex.: Tela, conector, mão de obra"></td>
    <td><select data-i="${i}" data-k="t" id="it-t-${i}"><option value="peca" ${it.t==='peca'?'selected':''}>Peça</option><option value="servico" ${it.t==='servico'?'selected':''}>Serviço</option></select></td>
    <td><input data-i="${i}" data-k="q" id="it-q-${i}" inputmode="numeric" value="${it.q}"></td>
    <td><input data-i="${i}" data-k="v" id="it-v-${i}" inputmode="decimal" value="${it.v?String(it.v).replace('.',','):''}" placeholder="0,00"></td>
    <td class="n" id="st-${i}"></td><td><button type="button" class="x" data-rm="${i}" aria-label="Remover item">×</button></td></tr>`).join('')
    :'<tr><td colspan="6" style="color:var(--muted);padding:10px 6px">Nenhum item. Adicione peças e mão de obra para montar o orçamento.</td></tr>';
  const tb=$('#it');
  tb.oninput=e=>{const el=e.target;if(!el.dataset.k)return;const it=cur.itens[+el.dataset.i];
    if(el.dataset.k==='d')it.d=el.value;else if(el.dataset.k==='t')it.t=el.value;else if(el.dataset.k==='q')it.q=parseNum(el.value);else it.v=parseNum(el.value);totais()};
  tb.onchange=tb.oninput;
  tb.onclick=e=>{const b=e.target.closest('[data-rm]');if(!b)return;cur.itens.splice(+b.dataset.rm,1);desenhaItens()};
  totais();
}
function totais(){
  let p=0,s=0;cur.itens.forEach((it,i)=>{const v=(+it.q||0)*(+it.v||0);if(it.t==='peca')p+=v;else s+=v;const c=$('#st-'+i);if(c)c.textContent=brl(v)});
  $('#t-p').textContent=brl(p);$('#t-s').textContent=brl(s);$('#t-t').textContent=brl(Math.max(0,p+s-(+cur.desconto||0)));
}
function desenhaFotos(){
  $('#fotos').innerHTML=cur.fotos.map((f,i)=>`<div class="foto"><img src="${f}" alt="Foto ${i+1} do aparelho"><button type="button" data-rf="${i}" aria-label="Remover foto">×</button></div>`).join('')+
   (cur.fotos.length<4?`<label class="addfoto">+ Foto<input type="file" accept="image/*" multiple id="f-foto"></label>`:'');
  $('#fotos').onclick=e=>{const b=e.target.closest('[data-rf]');if(b){cur.fotos.splice(+b.dataset.rf,1);desenhaFotos()}};
  const inp=$('#f-foto');if(inp)inp.onchange=async e=>{for(const f of [...e.target.files].slice(0,4-cur.fotos.length)){cur.fotos.push(await reduz(f))}desenhaFotos()};
}
function reduz(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height));
  const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.7))};im.src=r.result};r.readAsDataURL(file)})}

async function salvar(){
  const v=id=>$(id).value.trim();
  let ok=true;['#f-nome','#f-modelo','#f-defeito'].forEach(id=>{const e=$(id);const bad=!e.value.trim();e.classList.toggle('err',bad);if(bad)ok=false});
  if(!ok){toast('Preencha nome do cliente, modelo e defeito.');return}
  const dados={tipo:$('#f-tipo').value,marca:v('#f-marca'),modelo:v('#f-modelo'),serie:v('#f-serie'),senha:v('#f-senha'),
    defeito:v('#f-defeito'),estado:v('#f-estado'),acessorios:v('#f-acess'),previsao:$('#f-prev').value,pagamento:$('#f-pag').value,obs:v('#f-obs'),
    status:$('#f-status').value,desconto:cur.desconto,itens:cur.itens,fotos:cur.fotos,
    cliente:{nome:v('#f-nome'),tel:v('#f-tel'),end:v('#f-end')}};
  const btn=$('#salvar');btn.disabled=true;
  try{
    if(!cur.id){const r=await api('POST','/api/os',dados);toast(num(r.id)+' aberta');location.hash='#os-'+r.id}
    else{await api('PUT','/api/os/'+cur.id,dados);toast('Alterações salvas');await route()}
  }catch(e){toast(e.message);btn.disabled=false}
}

/* ===== WhatsApp ===== */
function texto(o){
  const c=cliente(o.clienteId);const p=c.nome.split(' ')[0];const ap=aparelho(o);const L=db.cfg.loja;const n=num(o.num);
  const itens=(o.itens||[]).filter(i=>i.d).map(i=>`• ${i.d}${i.q>1?' ('+i.q+'x)':''}: ${brl(i.q*i.v)}`).join('\n');
  const gar=+db.cfg.garantia||0;
  switch(o.status){
   case'recebido':return`Olá, ${p}! Recebemos seu ${ap} aqui na ${L}.\n\n*${n}*\nDefeito informado: ${o.defeito}\n\nVamos analisar e te avisamos por aqui assim que tivermos o diagnóstico.`;
   case'analise':return`Olá, ${p}! Seu ${ap} (${n}) está em análise. Assim que o técnico concluir, te mando o orçamento.`;
   case'aguardando':return`Olá, ${p}! Segue o orçamento do seu ${ap} (${n}):\n\n${itens||'• (adicione os itens)'}\n${o.desconto?'Desconto: -'+brl(o.desconto)+'\n':''}\n*Total: ${brl(total(o))}*\n${gar?'Garantia de '+gar+' dias.\n':''}\nPodemos seguir com o conserto? Responda *SIM* para aprovar.`;
   case'conserto':return`Olá, ${p}! Orçamento aprovado e seu ${ap} (${n}) já está em conserto.${o.previsao?'\nPrevisão de entrega: '+fData(o.previsao)+'.':''}`;
   case'pronto':return`Boa notícia, ${p}! Seu ${ap} está *pronto para retirada*. ✅\n\n${n}\nValor: *${brl(total(o))}*\n\nAceitamos Pix, dinheiro e cartão (débito e crédito).${db.cfg.end?'\nEndereço: '+db.cfg.end:''}`;
   case'entregue':{const base=o.entregueEm?new Date(o.entregueEm):new Date();const ate=new Date(base.getTime()+gar*dia).toLocaleDateString('pt-BR');
     return`Obrigado pela preferência, ${p}! Seu ${ap} foi entregue.${gar?'\nGarantia de '+gar+' dias, válida até '+ate+'. Guarde o número da '+n+'.':''}`}
   case'sem':return`Olá, ${p}. Infelizmente não foi possível consertar seu ${ap} (${n}).${total(o)?'\nTaxa de diagnóstico: '+brl(total(o))+'.':''}\nO aparelho já pode ser retirado.`;
  }
}
function gerarMsg(){$('#f-msg').value=texto(cur);atualizaWa()}
function atualizaWa(){
  const c=cliente(cur.clienteId);let d=digitos(c.tel);if(d.length===10||d.length===11)d='55'+d;
  $('#wa').href='https://wa.me/'+(d||'')+'?text='+encodeURIComponent($('#f-msg').value);
  $('#wa-hint').textContent=d?'Envia para '+c.tel:'Cliente sem telefone: o WhatsApp vai pedir para escolher o contato.';
}

/* ===== Comprovante ===== */
function comprovante(o){
  const c=cliente(o.clienteId);const g=db.cfg;
  const termo=(g.termo||'').replace(/\{dias\}/g,g.garantia);
  $('#ov').innerHTML=`<div class="overlay" id="ovl"><div class="ov-inner">
   <div class="sheet-actions"><button class="btn" id="cp-comp">Copiar texto</button><button class="btn" id="pr-comp">Imprimir</button><button class="btn pri" id="fx">Fechar</button></div>
   <div class="sheet" id="sheet">
    <div class="top"><div><h3>${esc(g.loja)}</h3><div>${esc(g.end)}</div><div>${esc(g.tel)}${g.doc?' · CNPJ '+esc(g.doc):''}</div></div>
      <div><div class="osn">${num(o.num)}</div><div style="text-align:right">Entrada: ${fHora(o.criadoEm)}<br>Situação: ${ST[o.status].n}</div></div></div>
    <section class="kv"><div><span>Cliente:</span> ${esc(c.nome)}</div><div><span>Telefone:</span> ${esc(c.tel)}</div>
      <div><span>Aparelho:</span> ${esc(aparelho(o))}</div><div><span>IMEI/Série:</span> ${esc(o.serie)||'—'}</div>
      <div><span>Acessórios:</span> ${esc(o.acessorios)||'nenhum'}</div><div><span>Previsão:</span> ${fData(o.previsao)}</div></section>
    <section><b>Defeito relatado:</b> ${esc(o.defeito)}${o.estado?`<br><b>Estado na entrada:</b> ${esc(o.estado)}`:''}</section>
    <section><table><thead><tr><th>Item</th><th class="r">Qtd</th><th class="r">Valor</th></tr></thead><tbody>
      ${o.itens.map(i=>`<tr><td>${esc(i.d)}</td><td class="r">${i.q}</td><td class="r">${brl(i.q*i.v)}</td></tr>`).join('')||'<tr><td colspan="3">Orçamento a definir</td></tr>'}
      ${o.desconto?`<tr><td>Desconto</td><td></td><td class="r">-${brl(o.desconto)}</td></tr>`:''}
      <tr><td><b>Total</b></td><td></td><td class="r"><b>${brl(total(o))}</b></td></tr></tbody></table>
      ${o.pagamento?`<div>Pagamento: ${esc(o.pagamento)}</div>`:''}</section>
    <section style="border:0;color:#333">${esc(termo)}</section>
    <div class="sign"><div>Cliente</div><div>${esc(g.loja)}</div></div>
   </div></div></div>`;
  const fechar=()=>$('#ov').innerHTML='';
  $('#fx').onclick=fechar;$('#ovl').onclick=e=>{if(e.target.id==='ovl')fechar()};
  $('#cp-comp').onclick=()=>copiar($('#sheet').innerText);
  $('#pr-comp').onclick=()=>window.print();
}

/* ===== Clientes ===== */
function vClientes(){
  $('#view').innerHTML=`<div class="head"><div><h1>Clientes</h1><p>${db.clientes.length} cadastrados</p></div></div>
   <div class="toolbar"><label class="search">${I.busca}<input id="qc" placeholder="Buscar por nome ou telefone" value="${esc(buscaCl)}"></label></div>
   <section class="panel"><div class="list" id="lc"></div></section>`;
  const des=()=>{const q=buscaCl.toLowerCase().trim(),qd=digitos(q);
    const r=db.clientes.filter(c=>!q||c.nome.toLowerCase().includes(q)||(qd&&digitos(c.tel).includes(qd))).sort((a,b)=>a.nome.localeCompare(b.nome));
    $('#lc').innerHTML=r.length?r.map(c=>{const os=db.os.filter(o=>o.clienteId==c.id);const ab=os.filter(o=>aberta(o.status)).length;
      const gasto=os.filter(o=>o.status==='entregue').reduce((a,o)=>a+total(o),0);
      return`<div class="cl"><div><b>${esc(c.nome)}</b><small>${esc(c.tel)||'sem telefone'} · ${os.length} OS${ab?` (${ab} em aberto)`:''}${gasto?' · '+brl(gasto)+' em serviços':''}</small></div>
        <button class="btn sm" data-n="${c.id}">${I.plus}Nova OS</button></div>`}).join(''):'<div class="empty">Nenhum cliente encontrado. Eles são cadastrados automaticamente ao abrir uma OS.</div>'};
  des();
  $('#qc').oninput=e=>{buscaCl=e.target.value;des()};
  $('#lc').onclick=e=>{const b=e.target.closest('[data-n]');if(!b)return;prefill=db.clientes.find(c=>c.id==b.dataset.n);location.hash='#nova'};
}

/* ===== Ajustes ===== */
function vAjustes(){
  const g=db.cfg;
  $('#view').innerHTML=`<div class="head"><div><h1>Ajustes</h1><p>Dados que aparecem no comprovante e nas mensagens</p></div></div>
  <div class="ed">
   <section class="card"><h2>Sua loja</h2>
    <div class="grid2">
     <div class="f span2"><label for="g-loja">Nome da loja</label><input id="g-loja" value="${esc(g.loja)}"></div>
     <div class="f"><label for="g-tel">Telefone / WhatsApp</label><input id="g-tel" value="${esc(g.tel)}"></div>
     <div class="f"><label for="g-doc">CNPJ (opcional)</label><input id="g-doc" class="mono" value="${esc(g.doc)}"></div>
     <div class="f span2"><label for="g-end">Endereço</label><input id="g-end" value="${esc(g.end)}"></div>
     <div class="f"><label for="g-gar">Garantia (dias)</label><input id="g-gar" inputmode="numeric" value="${g.garantia}"></div>
     <div class="f span2"><label for="g-termo">Termo de garantia</label><textarea id="g-termo" style="min-height:120px">${esc(g.termo)}</textarea><span class="hint">Use {dias} onde deve aparecer o prazo da garantia.</span></div>
    </div>
    <div class="actions"><button class="btn pri" id="g-salvar">Salvar dados da loja</button></div>
   </section>
   <div style="display:flex;flex-direction:column;gap:18px;min-width:0">
    <section class="card"><h2>Banco de dados</h2>
      <div class="f"><label>Arquivo</label><code class="mono" style="font-family:var(--f-mono);font-size:.82rem;word-break:break-all">${esc(db.info.arquivo||'')}</code></div>
      ${db.info.rede?`<div class="f"><label>Abrir no celular (mesmo Wi-Fi)</label><code style="font-family:var(--f-mono);font-size:.9rem">${esc(db.info.rede)}</code></div>`:''}
      <p style="margin:0;color:var(--muted);font-size:.88rem">Uma cópia do banco é salva automaticamente todo dia na pasta <b>backups</b>, guardando os últimos 30 dias.</p>
    </section>
    ${db.exemplo?`<section class="card"><h2>Dados de exemplo</h2><p style="margin:0;color:var(--muted)">Remove as OS e clientes de exemplo e deixa o sistema pronto para uso real.</p>
      <div class="actions"><button class="btn" id="g-ex">Apagar exemplos</button></div></section>`:''}
    <section class="card"><h2>Backup</h2><p style="margin:0;color:var(--muted)">Baixe um arquivo com tudo (OS, clientes, fotos e ajustes) para guardar no pen drive, e-mail ou Google Drive.</p>
      <div class="actions"><a class="btn" href="/api/backup" download>Baixar backup</a></div>
      <div class="f"><label for="g-imp">Restaurar a partir de um arquivo</label><input type="file" id="g-imp" accept=".json,application/json"></div>
      <div class="actions"><button class="btn" id="g-res">Restaurar</button></div>
      <span class="hint" style="font-size:.8rem;color:var(--muted)">Restaurar substitui todos os dados atuais pelos do arquivo.</span></section>
    <section class="card"><h2>Zerar sistema</h2><p style="margin:0;color:var(--muted)">Apaga todas as OS e clientes. Os backups diários continuam na pasta.</p>
      <div class="actions"><button class="btn danger" id="g-zero">Apagar tudo</button></div></section>
   </div>
  </div>`;
  $('#g-salvar').onclick=async()=>{try{await api('PUT','/api/config',{loja:$('#g-loja').value.trim()||'Maycell',tel:$('#g-tel').value.trim(),doc:$('#g-doc').value.trim(),
    end:$('#g-end').value.trim(),garantia:parseInt($('#g-gar').value)||0,termo:$('#g-termo').value});toast('Dados da loja salvos');await carregar();shell('ajustes')}catch(e){toast(e.message)}};
  const ex=$('#g-ex');if(ex)ex.onclick=async()=>{try{await api('POST','/api/exemplos/apagar');toast('Exemplos apagados');route()}catch(e){toast(e.message)}};
  $('#g-res').onclick=async()=>{const f=$('#g-imp').files[0];if(!f){toast('Escolha o arquivo de backup primeiro.');return}
    try{const d=JSON.parse(await f.text());await api('POST','/api/restaurar',d);toast('Backup restaurado');location.hash='#painel'}
    catch(e){toast(e instanceof SyntaxError?'Esse arquivo não é um backup do Maycell.':e.message)}};
  const z=$('#g-zero');let arm=0;z.onclick=async()=>{if(!arm){arm=1;z.classList.add('armed');z.textContent='Confirmar: apagar tudo';setTimeout(()=>{arm=0;z.classList.remove('armed');z.textContent='Apagar tudo'},4000);return}
    try{await api('POST','/api/zerar');toast('Sistema zerado');location.hash='#painel'}catch(e){toast(e.message)}};
}

/* ===== Copiar / aviso ===== */
function copiar(t){
  const fb=()=>{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();toast(ok?'Copiado':'Não deu para copiar automaticamente. Selecione o texto e copie.')};
  try{navigator.clipboard.writeText(t).then(()=>toast('Copiado'),fb)}catch(e){fb()}
}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2800)}

route();
</script>
